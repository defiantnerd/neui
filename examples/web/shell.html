<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neui</title>
<style>
  /* Minimal page for the neui examples on the web (plans/wasm-host.md): the
     APPWINDOW mounts into #neui-root; a DIALOG floats above the page. */
  html, body { margin: 0; background: #1e1e1e; color: #ccc;
               font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
  #neui-root { display: inline-block; margin: 12px; }
  #neui-status { margin: 12px; }
  #neui-status:empty { display: none; }
</style>
</head>
<body>
<div id="neui-status">Loading…</div>
<div id="neui-root"></div>
<script>
  function neuiFail(what) {
    var text = String(what);
    // A JSPI build in a browser without JSPI (Safari, older Firefox) fails
    // while instantiating; say so instead of hanging at "Downloading".
    if (typeof WebAssembly.Suspending !== 'function' && /Suspending|Suspender|promising/.test(text))
      text = 'This page is the JSPI build, which this browser does not support. '
           + 'Open the Asyncify build of this example instead (or mount it through neui-web.js, which picks one).';
    var status = document.getElementById('neui-status');
    status.textContent = 'Failed: ' + text;
    Module.setStatus = function() {};   // keep the message
  }
  var Module = {
    setStatus: function(text) { document.getElementById('neui-status').textContent = text || ''; },
    onAbort: neuiFail,
  };
  // The JSPI failure surfaces as an uncaught rejection, not through onAbort.
  function neuiNoJspi(what) {
    if (typeof WebAssembly.Suspending !== 'function' && /Suspending|Suspender|promising/.test(String(what)))
      neuiFail(what);
  }
  window.addEventListener('error', function(e) { neuiNoJspi(e.error || e.message); });
  window.addEventListener('unhandledrejection', function(e) { neuiNoJspi(e.reason); });
</script>
{{{ SCRIPT }}}
</body>
</html>
